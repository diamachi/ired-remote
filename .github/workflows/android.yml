name: Android build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.IRED_RELEASE_KEYSTORE_BASE64 }}
          IRED_RELEASE_STORE_PASSWORD: ${{ secrets.IRED_RELEASE_STORE_PASSWORD }}
          IRED_RELEASE_KEY_ALIAS: ${{ secrets.IRED_RELEASE_KEY_ALIAS }}
          IRED_RELEASE_KEY_PASSWORD: ${{ secrets.IRED_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/ired-release.jks"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            export IRED_RELEASE_STORE_FILE="$KEYSTORE_PATH"
            ./gradlew --no-daemon assembleRelease lintRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/iRed-${GITHUB_REF_NAME}.apk"
          else
            ./gradlew --no-daemon assembleDebug lintDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/iRed-${GITHUB_REF_NAME}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRed-${{ github.ref_name }}
          path: ${{ runner.temp }}/iRed-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: iRed-${{ github.ref_name }}
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.apk
